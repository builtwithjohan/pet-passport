name: Deploy to App Store & Play Store

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-deploy-android:
    name: Build & Publish Android (Google Play)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Check & Sync Capacitor Android
        run: |
          if [ -d "android" ]; then
            npx cap sync android
          else
            echo "Capacitor android directory not found; skipping mobile native sync."
          fi

      - name: Restore Keystore & Build AAB
        if: hashFiles('android/build.gradle') != ''
        working-directory: android
        env:
          MYAPP_RELEASE_STORE_FILE: release.jks
          MYAPP_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MYAPP_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MYAPP_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > app/release.jks
          ./gradlew bundleRelease

      - name: Upload to Play Store
        if: hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.petpassport.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

  build-and-deploy-ios:
    name: Build & Publish iOS (App Store)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Check & Sync Capacitor iOS
        run: |
          if [ -d "ios" ]; then
            npx cap sync ios
          else
            echo "Capacitor ios directory not found; skipping iOS native sync."
          fi

      - name: Archive & Export IPA
        if: hashFiles('ios/App/App.xcworkspace') != ''
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive archive

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist App/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/build

      - name: Upload to TestFlight
        if: hashFiles('${{ runner.temp }}/build/App.ipa') != ''
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ runner.temp }}/build/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

